plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.73'
}

base {
    archivesName = 'mctpsalert'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.140'

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
        server {
            server()
        }
    }

    mods {
        mctpsalert {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes([
            'Implementation-Title'   : 'mctpsalert',
            'Implementation-Version' : project.version,
        ])
    }
}

dependencies {
    // spark 为可选运行依赖，这里仅编译期引用其公共 API（me.lucko.spark.api）
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}
