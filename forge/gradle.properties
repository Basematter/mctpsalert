# Gradle JVM. ForgeGradle decompiles Minecraft, so it needs a reasonably large heap.
# -Dfile.encoding=UTF-8 keeps Gradle itself from falling back to the platform charset (GBK on zh-CN Windows).
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false

# ---- Minecraft / Forge ----
minecraft_version=1.20.1
forge_version=47.4.23
mapping_channel=official
mapping_version=1.20.1

# ---- Mod metadata (keep the version in sync with META-INF/mods.toml) ----
mod_id=mctpsalert
mod_name=MC TPS Alert
mod_license=MIT
mod_version=1.1.0
mod_group_id=com.basem.mctpsalert
